name: AIBOOSTER
options:
  # syncedFolder sources require XcodeGen 2.44.0+ and the xcode16_0 project format.
  minimumXcodeGenVersion: "2.44.0"
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AIBOOSTER:
    type: application
    platform: iOS
    sources:
      # Xcode 16 synchronized folder: new files on disk (e.g. after git pull)
      # appear in the project automatically — no regenerate / "Add Files" needed.
      - path: AIBOOSTER
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: aibooster
        PRODUCT_NAME: AIBooster
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AIBooster
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
